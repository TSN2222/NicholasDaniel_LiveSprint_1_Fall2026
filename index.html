<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Sprint One</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <h1>Welcome to the Interactive Reveal What’s that Animal UI</h1>
      <h2>Click on the buttons below to reveal the animal images</h2>
    </header>
    <main>
      <article id="cat">
        <img src="./assets/tabby-cat.jpg" alt="Tabby Cat" />
        <button id="hide-cat">Hide Result</button>
      </article>
      <article id="dog">
        <img src="./assets/dog.jpg" alt="Dog" />
        <button id="hide-dog">Hide Result</button>
      </article>
      <article id="cow">
        <img src="./assets/cow.jpg" alt="Cow" />
        <button id="hide-cow">Hide Result</button>
      </article>
    </main>
    <div id="show-btns">
      <button id="show-cat">Reveal a CAT</button>
      <button id="show-dog">Reveal a DOG</button>
      <button id="show-cow">Reveal a COW</button>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
